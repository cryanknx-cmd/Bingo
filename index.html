<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bingo Cards</title>
<style>
:root{--bg:#faf7f2;--surface:#fff;--text:#1d1b19;--muted:#6b665f;--accent:#d9480f;--accent-text:#fff;--border:#e4ded4;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171513;--surface:#23201d;--text:#f3efe9;--muted:#a39d94;--accent:#ff8a4c;--accent-text:#1a1208;--border:#37322d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171513;--surface:#23201d;--text:#f3efe9;--muted:#a39d94;--accent:#ff8a4c;--accent-text:#1a1208;--border:#37322d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
main{max-width:760px;margin:0 auto;padding:32px 20px 48px}
h1{margin:0 0 6px;font-size:2rem}
p.sub{margin:0 0 24px;color:var(--muted)}
.pick{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:28px;text-align:center}
button,a.btn{font:inherit;font-weight:600;background:var(--accent);color:var(--accent-text);border:0;border-radius:12px;padding:14px 22px;cursor:pointer;text-decoration:none;display:inline-block}
#result{margin-top:16px;min-height:1.5em}
#result .name{font-size:1.4rem;font-weight:700;margin-bottom:10px}
h2{font-size:1.1rem;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.grid a{display:block;text-align:center;padding:16px 8px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:12px;text-decoration:none;font-weight:600}
.grid a:hover,.grid a:focus-visible{border-color:var(--accent);outline:none}
</style>
</head>
<body>
<main>
<h1>Bingo Cards</h1>
<p class="sub">Pick a card below, or let fate choose for you. Cards open in a new tab.</p>
<section class="pick">
<button id="rand" type="button">🎲 Give me a random card</button>
<div id="result" aria-live="polite"></div>
</section>
<h2>All 30 cards</h2>
<div class="grid" id="grid"></div>
</main>
<script>
var base="https://mfbc.us/m/f4zbbk4/";
var grid=document.getElementById("grid"),result=document.getElementById("result");
for(var i=1;i<=30;i++){
  var a=document.createElement("a");
  a.href=base+i;a.target="_blank";a.rel="noopener noreferrer";a.textContent="Card "+i;
  grid.appendChild(a);
}
document.getElementById("rand").addEventListener("click",function(){
  var n=Math.floor(Math.random()*30)+1;
  result.innerHTML='<div class="name">Card '+n+'</div><a class="btn" target="_blank" rel="noopener noreferrer" href="'+base+n+'">Open my card</a>';
});
</script>
</body>
</html>
